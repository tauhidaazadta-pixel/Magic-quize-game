<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Magic Quiz - खेल खेल में सीखें</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #a8e6cf;
      --card-bg: #ffffff;
      --text: #2d3436;
      --pink: #ff7675;
      --blue: #74b9ff;
      --yellow: #ffeaa7;
      --green: #55efc4;
      --shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: var(--text);
    }

    /* Background floating emojis */
    .bg-emoji {
      position: absolute;
      font-size: 3rem;
      opacity: 0.3;
      animation: float 6s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    .game-container {
      position: relative;
      z-index: 1;
      width: min(95%, 600px);
      background: var(--card-bg);
      border-radius: 40px;
      padding: 30px 20px;
      box-shadow: var(--shadow), inset 0 -8px 0 rgba(0,0,0,0.05);
      text-align: center;
      border: 5px solid #fff;
    }

    /* --- START SCREEN --- */
    #startScreen h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: var(--pink);
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(255,118,117,0.3);
    }
    #startScreen p {
      font-size: 1.2rem;
      color: #636e72;
      margin-bottom: 30px;
    }
    .big-btn {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 20px 50px;
      font-size: 1.5rem;
      font-weight: 900;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      box-shadow: 0 8px 0 #0984e3;
      transition: all 0.1s;
    }
    .big-btn:active {
      transform: translateY(8px);
      box-shadow: 0 0px 0 #0984e3;
    }

    /* --- GAME SCREEN --- */
    #gameScreen { display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }
    .score-box {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: #fdcb6e;
      background: #fff8e1;
      padding: 8px 20px;
      border-radius: 20px;
      border: 3px solid #ffeaa7;
    }
    .sound-btn {
      background: #dfe6e9;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #b2bec3;
    }
    .sound-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #b2bec3;
    }

    .question-text {
      font-size: 1.8rem;
      font-weight: 900;
      color: #2d3436;
      margin-bottom: 30px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #fdfbfb;
      border: 4px solid #eee;
      border-radius: 25px;
      min-height: 120px;
      font-size: 3.5rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      box-shadow: 0 6px 0 #eee;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .option-btn:hover {
      transform: scale(1.05);
      border-color: var(--blue);
    }
    .option-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 0 #eee;
    }

    /* Right / Wrong Animations */
    .option-btn.correct {
      background: #d4edda;
      border-color: #28a745;
      box-shadow: 0 6px 0 #28a745;
      animation: pop 0.4s ease;
    }
    .option-btn.wrong {
      background: #f8d7da;
      border-color: #dc3545;
      box-shadow: 0 6px 0 #dc3545;
      animation: shake 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* --- END SCREEN --- */
    #endScreen { display: none; }
    #endScreen h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      color: #fdcb6e;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(253,203,110,0.4);
    }
    .stars-earned {
      font-size: 4rem;
      margin: 20px 0;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }

    /* Responsive */
    @media (max-width: 500px) {
      .option-btn { min-height: 90px; font-size: 2.8rem; }
      .question-text { font-size: 1.5rem; }
      #startScreen h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <!-- Background Decorations -->
  <div class="bg-emoji" style="top: 10%; left: 10%;">☁️</div>
  <div class="bg-emoji" style="bottom: 15%; left: 5%;">🌟</div>
  <div class="bg-emoji" style="top: 20%; right: 10%;">🎈</div>
  <div class="bg-emoji" style="bottom: 10%; right: 15%;">🍎</div>

  <div class="game-container">
    
    <!-- START SCREEN -->
    <div id="startScreen">
      <h1>🎮 जादुई खेल 🎮</h1>
      <p>चलो खेल-खेल में सीखें!</p>
      <button class="big-btn" onclick="startGame()">खेलना शुरू करें ▶</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen">
      <div class="top-bar">
        <div class="score-box">⭐ <span id="score">0</span></div>
        <button class="sound-btn" onclick="speakCurrentQuestion()">🔊</button>
      </div>
      
      <div class="question-text" id="questionText">Loading...</div>
      
      <div class="options-grid" id="optionsGrid">
        <!-- Options will be injected here -->
      </div>
    </div>

    <!-- END SCREEN -->
    <div id="endScreen">
      <h1>शाबाश! (Well Done)</h1>
      <p style="font-size: 1.5rem; font-weight: 800; color: #636e72;">तुमने पूरा खेल जीत लिया!</p>
      <div class="stars-earned">⭐⭐⭐</div>
      <button class="big-btn" onclick="startGame()">फिर से खेलें 🔄</button>
    </div>

  </div>

  <script>
    /* =========================================================
       1. GAME DATA (Questions & Options)
       ========================================================= */
    const QUESTIONS = [
      // Fruits
      { q: "🍎 Apple कौन सा है?", a: "🍎", opts: ["🍎", "🍌", "🍇", "🍊"], speak: "Find the Apple" },
      { q: "🍌 Banana कौन सा है?", a: "🍌", opts: ["🍉", "🍎", "🍌", "🍓"], speak: "Find the Banana" },
      // Animals
      { q: "🦁 Lion कौन सा है?", a: "🦁", opts: ["🐶", "🐱", "🐘", "🦁"], speak: "Find the Lion" },
      { q: "🐘 Elephant कौन सा है?", a: "🐘", opts: ["🐘", "🦒", "🐒", "🐯"], speak: "Find the Elephant" },
      // Arabic Letters
      { q: "Alif (ا) कौन सा है?", a: "ا", opts: ["ب", "ا", "ت", "ث"], speak: "Find Alif" },
      { q: "Baa (ب) कौन सा है?", a: "ب", opts: ["ج", "ب", "د", "ر"], speak: "Find Baa" },
      // Vehicles
      { q: "🚗 Car कौन सी है?", a: "🚗", opts: ["🚌", "🚲", "🚗", "🚂"], speak: "Find the Car" },
      { q: "🚀 Rocket कौन सा है?", a: "🚀", opts: ["✈️", "🚁", "🚀", "🚢"], speak: "Find the Rocket" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswering = false; // Blocks clicks while animating

    // DOM Elements
    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const endScreen = document.getElementById("endScreen");
    const questionText = document.getElementById("questionText");
    const optionsGrid = document.getElementById("optionsGrid");
    const scoreDisplay = document.getElementById("score");

    /* =========================================================
       2. AUDIO SYNTHESIS (For correct/wrong sounds)
       ========================================================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        // Happy ding (C5 -> E5 -> G5)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'wrong') {
        // Buzzer
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    /* =========================================================
       3. VOICE (Text to Speech)
       ========================================================= */
    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-US';
      utt.rate = 0.85;
      utt.pitch = 1.2; // Cute, high-pitched voice for kids
      
      // Try to find a female/child voice
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Samantha')));
      if (preferred) utt.voice = preferred;

      speechSynthesis.speak(utt);
    }

    function speakCurrentQuestion() {
      if (QUESTIONS[currentQuestionIndex]) {
        speakText(QUESTIONS[currentQuestionIndex].speak);
      }
    }

    /* =========================================================
       4. GAME LOGIC
       ========================================================= */
    function startGame() {
      // Resume audio context on user interaction
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      startScreen.style.display = "none";
      endScreen.style.display = "none";
      gameScreen.style.display = "block";
      
      currentQuestionIndex = 0;
      score = 0;
      scoreDisplay.textContent = score;
      
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= QUESTIONS.length) {
        showEndScreen();
        return;
      }

      isAnswering = false;
      const currentQ = QUESTIONS[currentQuestionIndex];
      
      // Update Text
      questionText.textContent = currentQ.q;
      
      // Auto Speak the question
      speakText(currentQ.speak);

      // Shuffle options
      const shuffledOpts = [...currentQ.opts].sort(() => Math.random() - 0.5);

      // Render options
      optionsGrid.innerHTML = "";
      shuffledOpts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(btn, opt, currentQ.a);
        optionsGrid.appendChild(btn);
      });
    }

    function checkAnswer(btn, selected, correctAnswer) {
      if (isAnswering) return; // Prevent spam clicking
      isAnswering = true;

      if (selected === correctAnswer) {
        // CORRECT
        btn.classList.add("correct");
        playSound("correct");
        
        // Update score
        score += 10;
        scoreDisplay.textContent = score;

        // Add little pop effect to score
        scoreDisplay.parentElement.style.transform = "scale(1.2)";
        setTimeout(() => scoreDisplay.parentElement.style.transform = "scale(1)", 200);

        // Next question after short delay
        setTimeout(() => {
          currentQuestionIndex++;
          loadQuestion();
        }, 1200);

      } else {
        // WRONG
        btn.classList.add("wrong");
        playSound("wrong");

        // Let them try again after animation
        setTimeout(() => {
          btn.classList.remove("wrong");
          isAnswering = false; 
        }, 600);
      }
    }

    function showEndScreen() {
      gameScreen.style.display = "none";
      endScreen.style.display = "block";
      playSound("correct");
      speakText("Wow! You won the game. Great job!");
      
      // Confetti effect (simple)
      for(let i=0; i<20; i++) {
        createConfetti();
      }
    }

    // Simple confetti using emojis
    function createConfetti() {
      const emojis = ["🎉", "⭐", "✨", "🎈", "🌟"];
      const el = document.createElement("div");
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.position = "fixed";
      el.style.left = Math.random() * 100 + "vw";
      el.style.top = "-50px";
      el.style.fontSize = (Math.random() * 20 + 20) + "px";
      el.style.transition = "transform 3s linear, opacity 3s";
      el.style.zIndex = "9999";
      document.body.appendChild(el);

      setTimeout(() => {
        el.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 720}deg)`;
        el.style.opacity = "0";
      }, 50);

      setTimeout(() => el.remove(), 3000);
    }

    // Warm up voices
    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
