<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Kids Adventure</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-fruits: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      --bg-animals: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      --bg-arabic: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      --bg-vehicles: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
      --bg-home: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #2d3436;
      --shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: var(--bg-home);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: var(--text);
      transition: background 0.5s ease;
    }

    /* Background floating elements */
    .floating-bg {
      position: absolute;
      font-size: 3rem;
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(15deg); }
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: min(95%, 550px);
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 35px;
      padding: 25px 20px 30px;
      box-shadow: var(--shadow), inset 0 0 0 4px rgba(255,255,255,0.5);
      text-align: center;
      border: 2px solid rgba(255,255,255,0.8);
      overflow: hidden;
    }

    /* --- SCREENS --- */
    .screen { display: none; animation: slideUp 0.5s ease; }
    .screen.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* --- START SCREEN --- */
    .game-title {
      font-family: 'Baloo 2', cursive;
      font-size: 3rem;
      line-height: 1;
      color: #6c5ce7;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(108,92,231,0.2);
    }
    .subtitle {
      font-size: 1.1rem;
      color: #636e72;
      margin-bottom: 30px;
      font-weight: 900;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .cat-btn {
      border: none;
      border-radius: 25px;
      padding: 20px 15px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #fff;
    }
    .cat-btn span { font-size: 2.8rem; }
    .cat-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 rgba(0,0,0,0.15); }
    
    .cat-fruits { background: linear-gradient(to bottom, #ff7675, #d63031); }
    .cat-animals { background: linear-gradient(to bottom, #55efc4, #00b894); }
    .cat-arabic { background: linear-gradient(to bottom, #fdcb6e, #e17055); }
    .cat-vehicles { background: linear-gradient(to bottom, #74b9ff, #0984e3); }

    /* --- GAME HEADER --- */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.6);
      padding: 10px 15px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .hearts { font-size: 1.5rem; letter-spacing: 2px; transition: transform 0.2s; }
    .score-box {
      font-family: 'Baloo 2', cursive;
      font-size: 1.3rem;
      color: #6c5ce7;
      background: #fff;
      padding: 5px 15px;
      border-radius: 15px;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
    }

    /* --- QUESTION --- */
    .progress-bar {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #fdcb6e, #e17055);
      width: 0%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .question-visual {
      font-size: 5rem;
      margin-bottom: 10px;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      line-height: 1;
    }
    .question-visual.arabic-text {
      font-family: "Traditional Arabic", "Amiri", serif;
      font-size: 6rem;
      color: #2d3436;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .question-text {
      font-family: 'Baloo 2', cursive;
      font-size: 1.8rem;
      color: #2d3436;
      margin-bottom: 20px;
      min-height: 45px;
    }

    .speak-btn {
      background: #fff;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #dfe6e9;
      margin-bottom: 15px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .speak-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #dfe6e9; }

    /* --- OPTIONS --- */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .opt-btn {
      background: #fff;
      border: 3px solid #f1f2f6;
      border-radius: 20px;
      min-height: 90px;
      font-size: 2.5rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #f1f2f6;
      transition: all 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #2d3436;
    }
    .opt-btn.text-opt {
      font-size: 1.4rem;
      font-family: 'Baloo 2', cursive;
    }
    .opt-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #f1f2f6; }
    
    .opt-btn.correct { background: #d4edda; border-color: #28a745; box-shadow: 0 6px 0 #28a745; animation: pop 0.3s; }
    .opt-btn.wrong { background: #f8d7da; border-color: #dc3545; box-shadow: 0 6px 0 #dc3545; animation: shake 0.3s; }
    .opt-btn.disabled { pointer-events: none; opacity: 0.6; }

    @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

    /* --- END SCREEN --- */
    .result-title { font-family: 'Baloo 2', cursive; font-size: 2.5rem; color: #00b894; margin-bottom: 10px; }
    .result-stars { font-size: 4rem; margin-bottom: 10px; }
    .result-score { font-size: 1.5rem; font-weight: 900; color: #636e72; margin-bottom: 25px; }
    
    .action-btn {
      background: linear-gradient(to bottom, #a29bfe, #6c5ce7);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 15px 30px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #4834d4;
      margin: 5px;
      width: 80%;
      transition: all 0.1s;
    }
    .action-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #4834d4; }
    .action-btn.home-btn { background: linear-gradient(to bottom, #fab1a0, #e17055); box-shadow: 0 6px 0 #d63031; }

    /* Confetti element */
    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      z-index: 9999;
      pointer-events: none;
    }

  </style>
</head>
<body>

  <!-- Floating Background Elements -->
  <div class="floating-bg" style="top: 10%; left: 10%;">🎈</div>
  <div class="floating-bg" style="top: 20%; right: 15%; animation-delay: 2s;">⭐</div>
  <div class="floating-bg" style="bottom: 15%; left: 20%; animation-delay: 4s;">☁️</div>
  <div class="floating-bg" style="bottom: 20%; right: 10%; animation-delay: 1s;">✨</div>

  <div class="app-container">
    
    <!-- 1. HOME SCREEN -->
    <div id="homeScreen" class="screen active">
      <h1 class="game-title">Super Kids<br>Adventure</h1>
      <p class="subtitle">क्या सीखना है आज? 🤩</p>
      
      <div class="category-grid">
        <button class="cat-btn cat-fruits" onclick="startGame('fruits')">
          <span>🍎</span> Fruits
        </button>
        <button class="cat-btn cat-animals" onclick="startGame('animals')">
          <span>🦁</span> Animals
        </button>
        <button class="cat-btn cat-arabic" onclick="startGame('arabic')">
          <span>ا</span> Arabic
        </button>
        <button class="cat-btn cat-vehicles" onclick="startGame('vehicles')">
          <span>🚗</span> Vehicles
        </button>
      </div>
    </div>

    <!-- 2. GAME SCREEN -->
    <div id="gameScreen" class="screen">
      <div class="game-header">
        <div class="hearts" id="hearts">❤️❤️❤️</div>
        <div class="score-box">⭐ <span id="score">0</span></div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-visual" id="questionVisual">🍎</div>
      <div class="question-text" id="questionText">Apple कौन सा है?</div>
      
      <button class="speak-btn" onclick="readQuestion()">🔊</button>

      <div class="options-grid" id="optionsGrid">
        <!-- Options injected here -->
      </div>
    </div>

    <!-- 3. END SCREEN -->
    <div id="endScreen" class="screen">
      <h1 class="result-title" id="resultTitle">शाबाश!</h1>
      <div class="result-stars" id="resultStars">⭐⭐⭐</div>
      <div class="result-score">Score: <span id="finalScore">0</span></div>
      
      <button class="action-btn" onclick="startGame(currentCategory)">फिर से खेलें 🔄</button>
      <button class="action-btn home-btn" onclick="goHome()">होम 🏠</button>
    </div>

  </div>

  <script>
    /* =========================================================
       1. DATA
       ========================================================= */
    const DATA = {
      fruits: [
        { name: "Apple", hi: "सेब", emoji: "🍎" },
        { name: "Banana", hi: "केला", emoji: "🍌" },
        { name: "Grapes", hi: "अंगूर", emoji: "🍇" },
        { name: "Orange", hi: "संतरा", emoji: "🍊" },
        { name: "Watermelon", hi: "तरबूज", emoji: "🍉" },
        { name: "Strawberry", hi: "स्ट्रॉबेरी", emoji: "🍓" },
        { name: "Mango", hi: "आम", emoji: "🥭" },
        { name: "Pineapple", hi: "अनानास", emoji: "🍍" }
      ],
      animals: [
        { name: "Lion", hi: "शेर", emoji: "🦁" },
        { name: "Elephant", hi: "हाथी", emoji: "🐘" },
        { name: "Monkey", hi: "बंदर", emoji: "🐒" },
        { name: "Tiger", hi: "बाघ", emoji: "🐯" },
        { name: "Dog", hi: "कुत्ता", emoji: "🐶" },
        { name: "Cat", hi: "बिल्ली", emoji: "🐱" },
        { name: "Rabbit", hi: "खरगोश", emoji: "🐰" },
        { name: "Bear", hi: "भालू", emoji: "🐻" }
      ],
      arabic: [
        { name: "Alif", hi: "अलिफ़", emoji: "ا" },
        { name: "Baa", hi: "बा", emoji: "ب" },
        { name: "Taa", hi: "ता", emoji: "ت" },
        { name: "Thaa", hi: "था", emoji: "ث" },
        { name: "Jeem", hi: "जीम", emoji: "ج" },
        { name: "Haa", hi: "हा", emoji: "ح" },
        { name: "Khaa", hi: "खा", emoji: "خ" },
        { name: "Daal", hi: "दाल", emoji: "د" }
      ],
      vehicles: [
        { name: "Car", hi: "कार", emoji: "🚗" },
        { name: "Bus", hi: "बस", emoji: "🚌" },
        { name: "Train", hi: "ट्रेन", emoji: "🚂" },
        { name: "Airplane", hi: "हवाई जहाज", emoji: "✈️" },
        { name: "Bicycle", hi: "साइकिल", emoji: "🚲" },
        { name: "Rocket", hi: "रॉकेट", emoji: "🚀" },
        { name: "Ship", hi: "जहाज", emoji: "🚢" },
        { name: "Helicopter", hi: "हेलीकॉप्टर", emoji: "🚁" }
      ]
    };

    /* =========================================================
       2. STATE & DOM
       ========================================================= */
    let currentCategory = "";
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let lives = 3;
    let isAnswering = false;
    const TOTAL_Q = 10;

    const screens = {
      home: document.getElementById("homeScreen"),
      game: document.getElementById("gameScreen"),
      end: document.getElementById("endScreen")
    };
    const ui = {
      hearts: document.getElementById("hearts"),
      score: document.getElementById("score"),
      progress: document.getElementById("progressFill"),
      visual: document.getElementById("questionVisual"),
      text: document.getElementById("questionText"),
      options: document.getElementById("optionsGrid"),
      finalScore: document.getElementById("finalScore"),
      resultStars: document.getElementById("resultStars"),
      resultTitle: document.getElementById("resultTitle")
    };

    /* =========================================================
       3. AUDIO & SPEECH
       ========================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol=0.1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function sfxCorrect() {
      playTone(523.25, 'sine', 0.1); // C5
      setTimeout(() => playTone(659.25, 'sine', 0.1), 100); // E5
      setTimeout(() => playTone(783.99, 'sine', 0.3), 200); // G5
    }

    function sfxWrong() {
      playTone(150, 'sawtooth', 0.3, 0.15);
      setTimeout(() => playTone(120, 'sawtooth', 0.3, 0.15), 150);
    }

    let speechEnabled = true;

    function speak(text, lang = 'en-US') {
      if (!speechEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = lang;
      utt.rate = 0.85;
      utt.pitch = 1.2; // Cute voice
      
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.includes(lang.substring(0,2)));
      if (preferred) utt.voice = preferred;
      
      speechSynthesis.speak(utt);
    }

    /* =========================================================
       4. GAME LOGIC
       ========================================================= */
    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function startGame(cat) {
      initAudio();
      currentCategory = cat;
      currentIndex = 0;
      score = 0;
      lives = 3;
      isAnswering = false;

      // Change Background Theme
      document.body.style.background = `var(--bg-${cat})`;

      // Generate Questions
      const pool = DATA[cat];
      questions = [];
      for (let i = 0; i < TOTAL_Q; i++) {
        // Shuffle pool and pick first 4 unique
        const shuffled = [...pool].sort(() => 0.5 - Math.random());
        const correct = shuffled[0];
        const options = [shuffled[0], shuffled[1], shuffled[2], shuffled[3]].sort(() => 0.5 - Math.random());
        questions.push({ correct, options });
      }

      updateUI();
      showScreen('game');
      loadQuestion();
    }

    function updateUI() {
      ui.score.textContent = score;
      ui.hearts.textContent = "❤️".repeat(lives) + "🤍".repeat(3 - lives);
      ui.progress.style.width = (currentIndex / TOTAL_Q) * 100 + "%";
    }

    function loadQuestion() {
      if (currentIndex >= TOTAL_Q || lives <= 0) {
        endGame();
        return;
      }

      isAnswering = false;
      const q = questions[currentIndex];
      
      // Decide question type (Alternating)
      const isTypeA = currentIndex % 2 === 0; 

      if (isTypeA) {
        // Show Emoji, ask name
        ui.visual.textContent = q.correct.emoji;
        ui.visual.className = currentCategory === 'arabic' ? 'question-visual arabic-text' : 'question-visual';
        ui.text.textContent = currentCategory === 'arabic' ? "यह अक्षर कौन सा है?" : "यह क्या है?";
        setTimeout(() => readQuestion(), 500);
      } else {
        // Show Name, ask emoji
        ui.visual.textContent = "🤔";
        ui.visual.className = "question-visual";
        ui.text.textContent = `"${q.correct.name}" कौन सा है?`;
        setTimeout(() => readQuestion(), 500);
      }

      // Render Options
      ui.options.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        
        if (isTypeA) {
          btn.textContent = opt.name;
          btn.classList.add("text-opt");
        } else {
          btn.textContent = opt.emoji;
          if (currentCategory === 'arabic') btn.style.fontFamily = "'Traditional Arabic', serif";
        }

        btn.onclick = () => checkAnswer(btn, opt, isTypeA);
        ui.options.appendChild(btn);
      });
    }

    function readQuestion() {
      if (currentIndex >= TOTAL_Q) return;
      const q = questions[currentIndex];
      const isTypeA = currentIndex % 2 === 0;
      
      if (currentCategory === 'arabic') {
        // Speak Arabic name
        speak(q.correct.name, 'en-US'); 
      } else {
        if (isTypeA) speak(`What is this?`);
        else speak(`Find ${q.correct.name}`);
      }
    }

    function checkAnswer(btn, selected, isTypeA) {
      if (isAnswering) return;
      isAnswering = true;
      
      const q = questions[currentIndex];
      const isCorrect = selected.name === q.correct.name;

      Array.from(ui.options.children).forEach(b => b.classList.add("disabled"));

      if (isCorrect) {
        btn.classList.add("correct");
        sfxCorrect();
        score += 10;
        createParticles(btn, "⭐");
        
        setTimeout(() => {
          currentIndex++;
          updateUI();
          loadQuestion();
        }, 1000);

      } else {
        btn.classList.add("wrong");
        sfxWrong();
        lives--;
        updateUI();
        ui.hearts.style.transform = "scale(1.3)";
        setTimeout(() => ui.hearts.style.transform = "scale(1)", 200);

        // Show correct answer
        Array.from(ui.options.children).forEach(b => {
          if (b.textContent === q.correct.emoji || b.textContent === q.correct.name) {
            b.classList.add("correct");
          }
        });

        speak("Oops! Try again next time.");

        setTimeout(() => {
          currentIndex++;
          updateUI();
          loadQuestion();
        }, 1800);
      }
    }

    function endGame() {
      showScreen('end');
      ui.finalScore.textContent = score;
      ui.progress.style.width = "100%";

      if (lives <= 0) {
        ui.resultTitle.textContent = "Game Over 😢";
        ui.resultTitle.style.color = "#d63031";
        ui.resultStars.textContent = "💔";
        speak("Game over! Better luck next time.");
      } else {
        ui.resultTitle.textContent = "शाबाश! (Well Done)";
        ui.resultTitle.style.color = "#00b894";
        
        let stars = "⭐";
        if (score >= 80) { stars = "⭐⭐⭐"; triggerConfetti(); speak("Excellent! You are a superstar!"); }
        else if (score >= 50) { stars = "⭐⭐"; speak("Great job! Keep it up."); }
        else { speak("Good effort! Practice makes perfect."); }
        
        ui.resultStars.textContent = stars;
      }
    }

    function goHome() {
      document.body.style.background = "var(--bg-home)";
      showScreen('home');
    }

    /* =========================================================
       5. VISUAL EFFECTS
       ========================================================= */
    function createParticles(parentEl, emoji) {
      const rect = parentEl.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 8; i++) {
        const p = document.createElement("div");
        p.textContent = emoji;
        p.style.position = "fixed";
        p.style.left = centerX + "px";
        p.style.top = centerY + "px";
        p.style.fontSize = "1.5rem";
        p.style.pointerEvents = "none";
        p.style.zIndex = "9999";
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = 50 + Math.random() * 50;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;

        p.style.transition = "all 0.6s cubic-bezier(0.25, 1, 0.5, 1)";
        document.body.appendChild(p);

        setTimeout(() => {
          p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
          p.style.opacity = "0";
        }, 10);

        setTimeout(() => p.remove(), 600);
      }
    }

    function triggerConfetti() {
      const colors = ['#ff7675', '#74b9ff', '#ffeaa7', '#55efc4', '#a29bfe'];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti-piece";
        c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.top = "-20px";
        c.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
        
        document.body.appendChild(c);
        
        const duration = Math.random() * 2 + 1.5;
        const delay = Math.random() * 0.5;
        
        setTimeout(() => {
          c.style.transition = `transform ${duration}s ease-in, opacity ${duration}s`;
          c.style.transform = `translateY(${window.innerHeight + 50}px) rotate(${Math.random() * 720}deg)`;
          c.style.opacity = "0";
        }, delay * 1000);

        setTimeout(() => c.remove(), (duration + delay) * 1000 + 100);
      }
    }

    // Preload voices
    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
    }

  </script>
</body>
</html>
